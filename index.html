<!DOCTYPE html>
<html dir="rtl">
<head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
</head>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif">
<input id="t" value="خان" style="padding:15px;font-size:24px;width:300px;margin:20px;font-family:'Noto Nastaliq Urdu'">
<button onclick="draw()" style="padding:15px;background:#0ea5e9;color:#fff;border:none;border-radius:10px">لکھیں</button>
<button onclick="voice()" style="padding:15px;background:red;color:#fff;border:none;border-radius:10px">🎤 بولیں</button>
<br><canvas id="c" width="900" height="600" style="background:#000;border-radius:15px;max-width:95%"></canvas>
<script>
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,900,600);ctx.fillStyle='#f5c97a';ctx.font="bold 90px 'Noto Nastaliq Urdu'";ctx.textAlign='center';ctx.fillText(document.getElementById('t').value,450,300)}
function voice(){let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();r.lang='ur-PK';r.start();r.onresult=e=>{document.getElementById('t').value=e.results[0][0].transcript;draw()}}
draw()
</script>
</body>
</html>
