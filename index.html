<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu PhotoCraft + Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
header{background:#151515;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-family:'Noto Nastaliq Urdu',serif}
.toolbar{background:#1e1e1e;padding:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type="text"]{padding:12px 15px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#fff;font-size:20px;font-family:'Noto Nastaliq Urdu',serif;width:280px}
.toolbar button{padding:12px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:bold}
.btn-blue{background:#0ea5e9;color:white}
.btn-green{background:#22c55e;color:white}
.btn-mic{background:#ef4444;color:white;animation:none}
.btn-mic.listening{animation:pulse 1s infinite;background:#dc2626}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.main{flex:1;display:flex;overflow:hidden}
#canvas-wrapper{flex:1;display:flex;justify-content:center;align-items:center;background:#222;padding:20px}
canvas{box-shadow:0 0 50px rgba(0,0,0,0.8)}
