<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urdu PhotoCraft</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center}
.top{padding:20px;background:#1e1e1e;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.top input[type="text"]{padding:14px;font-size:22px;width:300px;border-radius:10px;border:1px solid #444;background:#2a2a2a;color:#fff;font-family:'Noto Nastaliq Urdu',serif}
button{padding:12px 20px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.btn-blue{background:#0ea5e9;color:#fff}
.btn-green{background:#22c55e;color:#fff}
canvas{background:#0f0f0f;margin:20px auto;display:block;border-radius:15px;max-width:95%}
</style>
</head>
<body>
<h1 style="font-family:'Noto Nastaliq Urdu',serif;margin:20px">🎨 Urdu PhotoCraft - خان</h1>

<div class="top">
<input id="urduInput" type="text" value="خان" placeholder="یہاں لکھیں">
<button class="btn-blue" onclick="drawText()">✏️ لکھیں</button>
<input id="color" type="color" value="#f5c97a" onchange="drawText()">
<input id="size" type="range" min="30" max="150" value="90" oninput="drawText()">
<button class="btn-green" onclick="saveImage()">💾 محفوظ کریں</button>
</div>

<canvas id="myCanvas" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById('myCanvas');
const ctx = canvas.getContext('2d');
const input = document.getElementById('urduInput');

function drawText(){
  const text = input.value || 'خان';
  const color = document.getElementById('color').value;
  const size = document.getElementById('size').value;
  
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px 'Noto Nastaliq Urdu', serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 450, 300);
}

function saveImage(){
  const link = document.createElement('a');
  link.download = 'urdu-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
}

window.onload = drawText;
input.addEventListener('input', drawText);
</script>
</body>
</html>
